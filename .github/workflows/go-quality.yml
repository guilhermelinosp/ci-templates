name: go-quality

# All-in-one Go PR quality gate: module integrity, vet, race tests,
# canonical-config lint, build and optional smoke command.
# Inputs: go-version-file (default: go.mod), extra-commands (multiline shell),
#         coverage-artifact (default: true), build-command, smoke-command,
#         golangci-version (default: latest), runner (default: ubuntu-latest)
#
# Granular alternatives remain available: go-test, golangci, go-build.

on:
  workflow_call:
    inputs:
      go-version-file:
        required: false
        default: go.mod
        type: string
      extra-commands:
        description: >-
          Optional shell block run between vet and tests
          (e.g. architecture guards)
        required: false
        default: ""
        type: string
      coverage-artifact:
        required: false
        default: true
        type: boolean
      build-command:
        required: false
        default: go build ./...
        type: string
      smoke-command:
        description: >-
          Command proving the built binary works
          (e.g. ./bin/app --version)
        required: false
        default: ""
        type: string
      golangci-version:
        required: false
        default: latest
        type: string
      runner:
        required: false
        default: ubuntu-latest
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: go-quality / check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Verify module integrity
        # porcelain (not git diff) because stdlib-only modules legitimately
        # have no go.sum; git diff would abort on the missing pathspec.
        run: |
          go mod verify
          go mod tidy
          if git status --porcelain -- go.mod go.sum | grep -q .; then
            echo "::error::go.mod/go.sum out of sync —" \
              "run 'go mod tidy' and commit"
            git diff -- go.mod go.sum || true
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Extra repository-specific checks
        if: inputs.extra-commands != ''
        run: ${{ inputs.extra-commands }}

      - name: Test with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        if: inputs.coverage-artifact == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
          if-no-files-found: ignore

      - name: Use canonical golangci config
        run: >-
          cp .golangci.yml .golangci.ci.yml 2>/dev/null || echo "{}" >
          .golangci.ci.yml

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ inputs.golangci-version }}
          args: --config .golangci.ci.yml

      - name: Build
        run: ${{ inputs.build-command }}

      - name: Smoke binary
        if: inputs.smoke-command != ''
        run: ${{ inputs.smoke-command }}

  dependency-review:
    # Supply-chain check for changed dependencies. Runs on pull_request
    # events only (requires base/head refs); auto-skips otherwise.
    if: github.event_name == 'pull_request'
    name: go-quality / dependency-review
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
