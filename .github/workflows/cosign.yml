name: cosign

# Sign container images with cosign (keyless, OCI referrers)
# Env: COSIGN_EXPERIMENTAL=1 (auto-set)
# Secrets: GITHUB_TOKEN (auto)
# Inputs: image (digest required), runner (default: ubuntu-latest)

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: ubuntu-latest
        type: string
      image:
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  sign:
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Install buildah
        run: sudo apt-get update && sudo apt-get install -y buildah

      - name: Authenticate to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Validate input
        run: |
          set -euo pipefail

          IMAGE="${{ inputs.image }}"

          if [[ -z "$IMAGE" ]]; then
            echo "Image input is empty" >&2
            exit 1
          fi

          if [[ "$IMAGE" != *@sha256:* ]]; then
            echo "Image must be a digest (ghcr.io/...@sha256:...)" >&2
            echo "Received: $IMAGE" >&2
            exit 1
          fi

      - name: Sign image (OCI referrers mode)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail

          cosign sign \
            --yes \
            --registry-referrers-mode=oci-1-1 \
            "${{ inputs.image }}"
