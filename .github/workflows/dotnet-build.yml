name: dotnet-build

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: self-hosted
        type: string
      dotnet-version:
        required: false
        default: "10.0.x"
        type: string
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    env:
      DOTNET_ROOT: /home/runner/.dotnet
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Extract version
        id: version
        run: |
          TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "v0.0.0")
          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Detect solution
        run: |
          SLN=$(ls *.slnx *.sln 2>/dev/null | head -1 || echo "")
          echo "SLN=$SLN" >> $GITHUB_ENV

      - name: Restore
        run: |
          [ -n "$SLN" ] && dotnet restore "$SLN" || echo "no solution found"

      - name: Build
        run: |
          [ -n "$SLN" ] && dotnet build "$SLN" --configuration Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: |
          [ -n "$SLN" ] && dotnet test "$SLN" --configuration Release --no-build --verbosity normal
