name: dotnet-build

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: self-hosted
        type: string
      # NOTE: dotnet is pre-installed in the runner image (ghcr.io/guilhermelinosp/arc-actions-runner).
      # This input is kept for backwards compatibility but is no longer used to install dotnet.
      dotnet-version:
        required: false
        default: "10.0.301"
        type: string
      version:
        required: false
        default: ""
        type: string
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    env:
      DOTNET_ROOT: /usr/share/dotnet
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # .NET is provided by the runner image — no setup-dotnet step needed.

      - name: Extract version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' | head -1 || echo "v0.0.0")
            VERSION="${TAG#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Detect solution
        run: |
          SLN=$(find . -maxdepth 2 -name '*.slnx' -o -name '*.sln' 2>/dev/null | head -1 || echo "")
          echo "SLN=$SLN" >> $GITHUB_ENV

      - name: Restore
        run: |
          [ -n "$SLN" ] && dotnet restore "$SLN" || echo "no solution found"

      - name: Build
        run: |
          [ -n "$SLN" ] && dotnet build "$SLN" --configuration Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        env:
          HELLNET_SERVICE_NAME: test-service
          HELLNET_OTLP_ENDPOINT: http://localhost:4317
          HELLNET_OTLP_PROTOCOL: grpc
        run: |
          [ -n "$SLN" ] && dotnet test "$SLN" --configuration Release --no-build --verbosity normal
