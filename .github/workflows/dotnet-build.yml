name: dotnet-build

# .NET restore, build, test
# Inputs: dotnet-version (default: 10.0.301), version, runner (default: ubuntu-latest)

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: ubuntu-latest
        type: string
      dotnet-version:
        required: false
        default: "10.0.301"
        type: string
      version:
        required: false
        default: ""
        type: string
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Extract version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' | head -1 || echo "v0.0.0")
            VERSION="${TAG#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Detect solution
        run: |
          SLN=$(find . -maxdepth 2 \( -name '*.slnx' -o -name '*.sln' \) 2>/dev/null | head -1 || echo "")
          echo "SLN=$SLN" >> $GITHUB_ENV

      - name: Restore
        if: env.SLN != ''
        run: |
          dotnet restore "$SLN"

      - name: Build
        run: |
          [ -n "$SLN" ] && dotnet build "$SLN" --configuration Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: |
          [ -n "$SLN" ] && dotnet test "$SLN" --configuration Release --no-build --verbosity normal
