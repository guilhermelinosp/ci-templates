name: terraform-apply

# Terraform plan + apply with environment gating
# Secrets: TF_API_TOKEN, AWS keys (optional)
# Inputs: environment, dir (default: .), terraform-version (default: latest), aws-role-to-assume, aws-region (default: us-east-1), destroy (default: false)

on:
  workflow_call:
    inputs:
      dir:
        required: false
        default: "."
        type: string
      terraform-version:
        required: false
        default: "latest"
        type: string
      environment:
        required: true
        type: string
      destroy:
        required: false
        default: false
        type: boolean
      aws-role-to-assume:
        required: false
        default: ""
        type: string
      aws-region:
        required: false
        default: "us-east-1"
        type: string
    secrets:
      TF_API_TOKEN:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure AWS credentials (OIDC)
        if: ${{ inputs.aws-role-to-assume != '' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          role-session-name: terraform-plan-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ inputs.terraform-version }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform init
        run: |
          terraform -chdir=${{ inputs.dir }} init

      - name: Terraform plan
        id: plan
        run: |
          terraform -chdir=${{ inputs.dir }} plan \
            -out=tfplan \
            -no-color
        continue-on-error: true

      - name: Upload plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ inputs.dir }}/tfplan

  apply:
    needs: [plan]
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      && needs.plan.outputs.plan-exitcode == '0'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure AWS credentials (OIDC)
        if: ${{ inputs.aws-role-to-assume != '' }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          role-session-name: terraform-apply-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ inputs.dir }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ inputs.terraform-version }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform init
        run: |
          terraform -chdir=${{ inputs.dir }} init

      - name: Terraform apply
        if: ${{ !inputs.destroy }}
        run: |
          terraform -chdir=${{ inputs.dir }} apply tfplan

      - name: Terraform destroy
        if: ${{ inputs.destroy }}
        run: |
          terraform -chdir=${{ inputs.dir }} destroy -auto-approve
