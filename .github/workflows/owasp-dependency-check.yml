name: owasp-dependency-check

# OWASP Dependency Check
# Inputs: format (default: SARIF), fail-on (default: CVSS_SCORE_7)

on:
  workflow_call:
    inputs:
      format:
        required: false
        default: "SARIF"
        type: string
      fail-on:
        required: false
        default: "CVSS_SCORE_7"
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          format: ${{ inputs.format }}
          fail_on_cvss: ${{ inputs.fail-on }}
          output_dir: dc-report

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: dc-report/dependency-check-report.sarif
