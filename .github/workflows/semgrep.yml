name: semgrep

# Semgrep SAST static analysis
# Inputs: config (default: p/default), severity (default: ERROR,WARNING)

on:
  workflow_call:
    inputs:
      config:
        required: false
        default: "p/default"
        type: string
      severity:
        required: false
        default: "ERROR,WARNING"
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # semgrep-action@v1 has a broken `args` passthrough (exec: "--config");
      # run the semgrep CLI directly instead. .github is excluded because the
      # workflows are scanned by analyze(actions) separately.
      - name: Run semgrep
        id: semgrep
        run: |
          pip install --quiet --break-system-packages semgrep
          severity_args=""
          for s in $(echo "${{ inputs.severity }}" | tr ',' ' '); do
            severity_args="$severity_args --severity $s"
          done
          semgrep --config "${{ inputs.config }}" $severity_args --exclude .github --sarif-output semgrep.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif