name: slsa

# SLSA provenance generation
# Env: COSIGN_EXPERIMENTAL=1 (auto-set)
# Inputs: image, predicate-type (default: https://slsa.dev/provenance/v1)

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      predicate-type:
        required: false
        default: "https://slsa.dev/provenance/v1"
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad

      - name: Generate SLSA provenance
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest \
            --yes \
            --type slsaprovenance \
            --predicate-type ${{ inputs.predicate-type }} \
            ${{ inputs.image }}

      - name: Verify provenance
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify-attestation \
            --type slsaprovenance \
            ${{ inputs.image }}
