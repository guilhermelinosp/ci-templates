name: nuget-pipeline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    uses: guilhermelinosp/ci-templates/.github/workflows/nuget-build.yml@main

  tag:
    needs: [build]
    uses: guilhermelinosp/ci-templates/.github/workflows/nuget-tag.yml@main

  publish:
    needs: [tag]
    uses: guilhermelinosp/ci-templates/.github/workflows/nuget-publish.yml@main
    secrets: inherit

  release:
    needs: [tag, publish]
    uses: guilhermelinosp/ci-templates/.github/workflows/nuget-release.yml@main
    secrets: inherit
