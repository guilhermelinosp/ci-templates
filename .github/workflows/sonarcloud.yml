name: sonarcloud

# SonarCloud analysis + PR decoration
# Secrets: SONAR_TOKEN (required)
# Inputs: project-key, organization, dotnet-version, go-version

on:
  workflow_call:
    inputs:
      project-key:
        required: true
        type: string
      organization:
        required: true
        type: string
      language:
        required: false
        default: "other"
        type: string
      dotnet-version:
        required: false
        default: ""
        type: string
      go-version:
        required: false
        default: ""
        type: string
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup .NET
        if: ${{ inputs.dotnet-version != '' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Setup Go
        if: ${{ inputs.go-version != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ inputs.go-version }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: |
            -Dsonar.projectKey=${{ inputs.project-key }}
            -Dsonar.organization=${{ inputs.organization }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
