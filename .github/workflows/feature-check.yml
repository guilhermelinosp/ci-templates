name: feature-check

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Conventional Commits (últimos commits)
        run: |
          echo "Commits desde origin/main:"
          git fetch origin main 2>/dev/null || true
          git log --oneline origin/main..HEAD 2>/dev/null | while read line; do
            if echo "$line" | grep -q '^Merge'; then continue; fi
            MSG=$(echo "$line" | sed 's/^[a-f0-9]* //')
            if echo "$MSG" | grep -qE '^(feat|fix|docs|style|ref|refactor|test|chore|ci|perf|build|revert)(\(.+\))?!?:\s.+'; then
              echo "✅ $MSG"
            else
              echo "⚠️ $MSG"
            fi
          done
