name: goreleaser-publish

# Build cross-platform binaries with GoReleaser and UPLOAD them (plus a
# checksums file) onto the EXISTING GitHub Release that the shared `release`
# workflow already created for this tag. GoReleaser does NOT manage the
# GitHub release here, so there is no "release already exists" conflict.
#
# The org `release` reusable workflow owns the GitHub Release + tag.
# This job only builds artifacts and attaches them to that release.

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        default: "."
        type: string
      go-version-file:
        required: false
        default: ""
        type: string
      args:
        description: GoReleaser args (defaults to build-only; the release is owned by the `release` workflow)
        required: false
        default: build --clean
        type: string
      pre-release-commands:
        description: Optional shell block executed in the repo before GoReleaser runs (e.g. architecture guards)
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        if: inputs.go-version-file != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Fetch and checkout the release tag
        run: git fetch --tags --force && git checkout "$(git describe --tags --abbrev=0 --exclude 'latest')"

      - name: Pre-release repository checks
        if: inputs.pre-release-commands != ''
        run: ${{ inputs.pre-release-commands }}

      - name: Build binaries with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ inputs.args }}
          workdir: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Collect artifacts with unique names + checksums
        working-directory: ${{ inputs.working-directory }}
        run: |
          rm -rf /tmp/artifacts && mkdir -p /tmp/artifacts
          cd dist
          # checksums for every real artifact (goreleaser's internal metadata.json excluded)
          find . -type f ! -name 'metadata.json' -exec sha256sum {} + > /tmp/artifacts/checksums.txt
          # goreleaser build emits each binary under dist/<target>/<binary> with identical
          # basenames; give each a unique name so gh release upload does not collide.
          find . -type f ! -name 'metadata.json' | while read -r f; do
            name="$(echo "$f" | sed 's#^\./##; s#/#_#g')"
            cp "$f" "/tmp/artifacts/$name"
          done
          echo "artifacts to upload:"
          ls -1 /tmp/artifacts

      - name: Upload artifacts to the existing release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="$(git describe --tags --abbrev=0 --exclude 'latest')"
          gh release upload "$TAG" /tmp/artifacts/* --clobber
