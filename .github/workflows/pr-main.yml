name: pr-main

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate branch name
        run: |
          HEAD="${{ github.head_ref }}"
          echo "Branch: $HEAD → main"
          case "$HEAD" in
            staging|hotfix/*) echo "✅ $HEAD → main" ;;
            *) echo "❌ Para main, use staging ou hotfix/*"; exit 1 ;;
          esac

      - name: Check unreleased changes
        run: |
          git fetch origin ${{ github.base_ref }} 2>/dev/null || true
          COMMITS=$(git log --oneline origin/${{ github.base_ref }}..HEAD 2>/dev/null)
          echo "Commits a serem lançados:"
          echo "$COMMITS"
