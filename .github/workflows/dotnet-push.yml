name: dotnet-push

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: self-hosted
        type: string
      dotnet-version:
        required: false
        default: "10.0.301"
        type: string
      version:
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

jobs:
  push:
    runs-on: ${{ inputs.runner }}
    env:
      DOTNET_ROOT: /home/runner/.dotnet
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Pack
        run: |
          SLN=$(find . -maxdepth 2 -name '*.slnx' -o -name '*.sln' 2>/dev/null | head -1 || echo "")
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          # Fallback: detect version from latest git tag
          if [ -z "$VERSION" ]; then
            VERSION=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' | head -1 | sed 's/^v//' || echo "0.0.0")
          fi
          [ -n "$SLN" ] && dotnet pack "$SLN" --configuration Release --output ./artifacts -p:Version=$VERSION

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NuGet.org
        run: |
          if [ -n "$NUGET_API_KEY" ]; then
            dotnet nuget push "./artifacts/*.nupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY"
          else
            echo "NUGET_API_KEY not set — skipping NuGet.org"
          fi

      - name: Create GitHub Release
        if: inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
