name: aws-deploy-ecs

on:
  workflow_call:
    inputs:
      aws-region:
        required: false
        default: "us-east-1"
        type: string
      ecs-cluster:
        required: true
        type: string
      ecs-service:
        required: true
        type: string
      ecs-task-def:
        required: true
        type: string
      container-name:
        required: true
        type: string
      image:
        required: true
        type: string
      role-to-assume:
        required: true
        type: string
      wait-for-service-stable:
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}

      - name: Render task definition
        id: render
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition ${{ inputs.ecs-task-def }} \
            --query 'taskDefinition' > /tmp/task-def.json)
          echo "Rendered task definition"

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/task-def.json
          container-name: ${{ inputs.container-name }}
          image: ${{ inputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ inputs.ecs-service }}
          cluster: ${{ inputs.ecs-cluster }}
          wait-for-service-stable: ${{ inputs.wait-for-service-stable }}
