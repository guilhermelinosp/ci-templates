name: shellcheck

# ShellCheck linter
# Inputs: dir (default: .)

on:
  workflow_call:
    inputs:
      dir:
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: ShellCheck
        uses: reviewdog/action-shellcheck@0722bbdb0d47f04c1b53b8734d2422ac63a45ec6
        with:
          reporter: github-check
          level: error
          filter_mode: nofilter
          workdir: ${{ inputs.dir }}

      - name: Check formatting (shfmt)
        run: |
          sudo apt-get update && sudo apt-get install -y shfmt
          shfmt -d $(find ${{ inputs.dir }} -name '*.sh' -not -path './.git/*' 2>/dev/null) || \
            echo "Run 'shfmt -w .' to fix formatting"
