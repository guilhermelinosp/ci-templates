name: terraform-docs

on:
  workflow_call:
    inputs:
      dir:
        required: false
        default: "."
        type: string
      output-file:
        required: false
        default: "README.md"
        type: string
      output-format:
        required: false
        default: "markdown table"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install terraform-docs
        run: |
          wget -q "https://github.com/terraform-docs/terraform-docs/releases/latest/download/terraform-docs-linux-amd64.tar.gz"
          tar xzf terraform-docs-linux-amd64.tar.gz
          sudo mv terraform-docs /usr/local/bin/

      - name: Generate docs
        run: |
          terraform-docs ${{ inputs.output-format }} \
            --output-file ${{ inputs.output-file }} \
            ${{ inputs.dir }}

      - name: Check for changes
        id: diff
        run: |
          if ! git diff --quiet; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit docs
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.output-file }}
          git commit -m "docs: auto-update terraform docs"
          git push
