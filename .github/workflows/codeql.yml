name: codeql

# Reusable workflow — libs chamam via:
#   codeql:
#     uses: guilhermelinosp/ci-templates/.github/workflows/codeql.yml@main
# Também dispara sozinho (push/PR/schedule) caso o repo queira.
on:
  workflow_call:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '16 16 * * 3'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript
            build-mode: autobuild
          - language: csharp
            build-mode: autobuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Garante o toolchain correto (lê go.mod) para o autobuild do CodeQL
      # compilar libs em Go 1.27+ — sem isso, falha em "unable to build".
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-and-quality

      # Build manual (caso alguma linguagem use build-mode: manual)
      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode for one or more of the' \
            'languages you are analyzing, replace this with the commands to build' \
            'your code, for example:'
          echo '  make bootstrap'
          echo '  make release'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
