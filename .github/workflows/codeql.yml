name: codeql

# Reusable workflow — libs/templates chamam via:
#   codeql:
#     uses: guilhermelinosp/ci-templates/.github/workflows/codeql.yml@main
#     with:
#       languages: '[{"language":"actions","build-mode":"none"},{"language":"go","build-mode":"autobuild"}]'
#
# O caller passa o JSON de linguagens que FAZEM SENTIDO pro repo
# (um template bash so tem "actions"; um lib Go tem "actions"+"go"; um lib
# dotnet tem "actions"+"csharp"). Isso evita falha de autobuild em linguagem
# inexistente no repo.
#
# Matriz condicional:
#   - workflow_call: usa inputs.languages (default = actions/go/javascript/csharp)
#   - pull_request/push standalone (o proprio ci-templates, so workflows YAML): so "actions"
on:
  workflow_call:
    inputs:
      languages:
        description: 'JSON array de objetos {"language","build-mode"}. Ex.: [{"language":"go","build-mode":"autobuild"}]'
        required: false
        default: '[{"language":"actions","build-mode":"none"},{"language":"go","build-mode":"autobuild"},{"language":"javascript","build-mode":"autobuild"},{"language":"csharp","build-mode":"autobuild"}]'
  pull_request:
    branches: [ "main" ]

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{
            github.event_name == 'workflow_call' && fromJson(inputs.languages) || fromJson('[
              {"language": "actions", "build-mode": "none"}
            ]')
          }}

    name: analyze (${{ matrix.language }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Garante o toolchain correto (lê go.mod) para o autobuild do CodeQL
      # compilar libs em Go 1.27+. So roda no matrix go com autobuild.
      - name: Set up Go
        if: matrix.language == 'go' && matrix.build-mode == 'autobuild'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-and-quality

      # Build manual (caso alguma linguagem use build-mode: manual)
      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode for one or more of the' \
            'languages you are analyzing, replace this with the commands to build' \
            'your code, for example:'
          echo '  make bootstrap'
          echo '  make release'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
