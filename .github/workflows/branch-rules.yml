name: branch-rules

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
      - homolog
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Block direct push to protected branches
        if: github.event_name == 'push'
        run: |
          echo "❌ Push direto para ${{ github.ref_name }} não permitido."
          echo "Crie um PR da sua branch feature/*, hotfix/* ou release/*."
          exit 1

      - name: Validate branch name
        if: github.event_name == 'pull_request'
        run: |
          HEAD="${{ github.head_ref }}"
          BASE="${{ github.base_ref }}"

          echo "PR: $HEAD → $BASE"

          case "$BASE" in
            develop)
              case "$HEAD" in
                feature/*|bugfix/*) echo "✅ Válido: $HEAD → develop" ;;
                *) echo "❌ Para develop, use branches feature/* ou bugfix/*"; exit 1 ;;
              esac
              ;;
              homolog)
              case "$HEAD" in
                develop|hotfix/*) echo "✅ Válido: $HEAD → homolog" ;;
                *) echo "❌ Para homolog, use develop ou hotfix/*"; exit 1 ;;
              esac
              ;;
            main)
              case "$HEAD" in
                homolog|hotfix/*) echo "✅ Válido: $HEAD → main" ;;
                *) echo "❌ Para main, use homolog ou hotfix/*"; exit 1 ;;
              esac
              ;;
            *) echo "❌ Base branch inválida: $BASE"; exit 1 ;;
          esac

      - name: Validate PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if echo "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|revert)\([a-zA-Z0-9_-]+\):\s.+'; then
            echo "✅ PR title válido: $TITLE"
          else
            echo "❌ PR title deve seguir Conventional Commits: tipo(escopo): descrição"
            echo "   Ex: feat(auth): adiciona login com Google"
            echo "   Ex: fix(api): corrige timeout do gateway"
            exit 1
          fi
