name: buildx

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      registry_owner:
        required: true
        type: string
    outputs:
      image:
        value: ${{ jobs.buildx.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  buildx:
    runs-on: ${{ inputs.runner }}
    outputs:
      image: ${{ steps.export.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Login GHCR
        run: |
          TOKEN="${{ secrets.GHCR_PAT }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
          echo "$TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Setup buildx
        run: |
          docker buildx create --name ci-builder --driver docker-container \
            --config /dev/null --bootstrap --use 2>/dev/null || docker buildx use ci-builder

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.cache
          key: buildx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ runner.os }}-

      - name: Build and push
        run: |
          IMG="ghcr.io/${{ inputs.registry_owner }}/${{ github.event.repository.name }}"
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --attest type=sbom \
            --attest type=provenance,mode=max \
            --cache-from type=local,src=/tmp/.cache \
            --cache-to type=local,dest=/tmp/.cache-new,mode=max \
            --metadata-file /tmp/metadata.json \
            -t "${IMG}:latest" .

      - name: Move cache
        run: |
          rm -rf /tmp/.cache
          mv /tmp/.cache-new /tmp/.cache

      - name: Export digest
        id: export
        run: |
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/metadata.json)
          echo "image=ghcr.io/${{ inputs.registry_owner }}/${{ github.event.repository.name }}@${DIGEST}" >> $GITHUB_OUTPUT
