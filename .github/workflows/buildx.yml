name: buildx

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      registry_owner:
        required: true
        type: string
    outputs:
      image:
        value: ${{ jobs.buildx.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  buildx:
    runs-on: ${{ inputs.runner }}
    outputs:
      image: ${{ steps.export.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Login GHCR
        run: |
          TOKEN="${{ secrets.GHCR_PAT }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
          echo "$TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Setup buildx
        run: |
          if ! docker buildx version &>/dev/null; then
            if [ -f /usr/libexec/docker/cli-plugins/docker-buildx ]; then
              mkdir -p ~/.docker/cli-plugins
              cp /usr/libexec/docker/cli-plugins/docker-buildx ~/.docker/cli-plugins/
            fi
            if ! docker buildx version &>/dev/null; then
              echo "buildx nao disponivel, tentando download..."
              mkdir -p ~/.docker/cli-plugins
              curl -sL "https://github.com/docker/buildx/releases/download/v0.33.0/buildx-v0.33.0.linux-amd64" -o ~/.docker/cli-plugins/docker-buildx && chmod +x ~/.docker/cli-plugins/docker-buildx
            fi
          fi
          docker buildx version && docker buildx create --name ci-builder --driver docker-container --use 2>/dev/null || docker buildx use ci-builder
      - name: Build and push
        run: |
          IMG="ghcr.io/${{ inputs.registry_owner }}/${{ github.event.repository.name }}"
          docker buildx build --platform linux/amd64 --push --attest type=sbom --attest type=provenance,mode=max \
            -t "${IMG}:latest" .
      - name: Export digest
        id: export
        run: |
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/${{ inputs.registry_owner }}/${{ github.event.repository.name }}:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=ghcr.io/${{ inputs.registry_owner }}/${{ github.event.repository.name }}@${DIGEST}" >> $GITHUB_OUTPUT
