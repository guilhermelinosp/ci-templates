name: buildx

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      registry_owner:
        required: true
        type: string
    outputs:
      image:
        value: ${{ jobs.buildx.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  buildx:
    runs-on: ${{ inputs.runner }}
    outputs:
      image: ${{ steps.export.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Setup buildx
        run: |
          SRC=/usr/libexec/docker/cli-plugins/docker-buildx
          DST=/usr/local/lib/docker/cli-plugins/docker-buildx
          if [ ! -f "$DST" ] && [ -f "$SRC" ]; then
            mkdir -p /usr/local/lib/docker/cli-plugins && cp "$SRC" "$DST" && chmod +x "$DST"
          fi
          if ! docker buildx version &>/dev/null; then
            curl -fsSL "https://github.com/docker/buildx/releases/download/v0.33.0/buildx-v0.33.0.linux-amd64" -o "$DST" && chmod +x "$DST"
          fi
          docker buildx version && docker buildx create --name ci-builder --driver docker-container --use 2>/dev/null || docker buildx use ci-builder
      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64 --push --attest type=sbom --attest type=provenance,mode=max \
            -t "ghcr.io/${{ inputs.registry_owner }}/${{ github.event.repository.name }}:latest" .
      - name: Export digest
        id: export
        run: |
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/${{ inputs.registry_owner }}/${{ github.event.repository.name }}:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=ghcr.io/${{ inputs.registry_owner }}/${{ github.event.repository.name }}@${DIGEST}" >> $GITHUB_OUTPUT
