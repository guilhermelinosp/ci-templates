name: buildx

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      registry_owner:
        required: true
        type: string
    outputs:
      image:
        value: ${{ jobs.buildx.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  buildx:
    runs-on: ${{ inputs.runner }}
    outputs:
      image: ${{ steps.export.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Setup buildx
        run: |
          # O buildx esta em /usr/libexec na imagem ghcr (Docker 29+)
          # Docker procura em ~/.docker/cli-plugins ou /usr/local/lib/docker/cli-plugins
          if ! docker buildx version &>/dev/null; then
            if [ -f /usr/libexec/docker/cli-plugins/docker-buildx ]; then
              mkdir -p ~/.docker/cli-plugins
              cp /usr/libexec/docker/cli-plugins/docker-buildx ~/.docker/cli-plugins/
            fi
            if ! docker buildx version &>/dev/null; then
              echo "buildx nao disponivel, tentando download..."
              mkdir -p ~/.docker/cli-plugins
              curl -sL "https://github.com/docker/buildx/releases/download/v0.33.0/buildx-v0.33.0.linux-amd64" -o ~/.docker/cli-plugins/docker-buildx && chmod +x ~/.docker/cli-plugins/docker-buildx
            fi
          fi

          # Pull custom buildkit image com Hellnet CA
          docker pull ghcr.io/guilhermelinosp/buildkit-hellnet:latest

          # Cria builder com imagem custom (Hellnet CA trust)
          docker buildx create --name ci-builder --driver docker-container \
            --driver-opt "image=ghcr.io/guilhermelinosp/buildkit-hellnet:latest" \
            --use 2>/dev/null || docker buildx use ci-builder
      - name: Build and push
        run: |
          CACHE_ARGS=""
          if [ -n "$S3_ENDPOINT_URL" ] && [ -n "$AWS_ACCESS_KEY_ID" ]; then
            REPO_PREFIX="${{ github.repository }}"
            CACHE_ARGS="--cache-to type=s3,bucket=docker-cache,region=${AWS_REGION:-us-east-1},endpoint_url=$S3_ENDPOINT_URL,use_path_style=true,prefix=${REPO_PREFIX}/,mode=max \
              --cache-from type=s3,bucket=docker-cache,region=${AWS_REGION:-us-east-1},endpoint_url=$S3_ENDPOINT_URL,use_path_style=true,prefix=${REPO_PREFIX}/"
          fi
          docker buildx build --platform linux/amd64 --push --attest type=sbom --attest type=provenance,mode=max \
            $CACHE_ARGS \
            -t "ghcr.io/${{ inputs.registry_owner }}/${{ github.event.repository.name }}:latest" .
      - name: Export digest
        id: export
        run: |
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/${{ inputs.registry_owner }}/${{ github.event.repository.name }}:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=ghcr.io/${{ inputs.registry_owner }}/${{ github.event.repository.name }}@${DIGEST}" >> $GITHUB_OUTPUT
