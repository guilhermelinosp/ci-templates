name: vault-auth

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: ubuntu-latest
        type: string
      login_minio:
        required: false
        type: boolean
        default: false
      login_ghcr:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  VAULT_SKIP_VERIFY: "true"

jobs:
  auth:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Install vault
        run: |
          sudo apt-get update && sudo apt-get install -y gpg
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y vault

      - name: Install mc (minio client)
        run: |
          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc -O /tmp/mc
          chmod +x /tmp/mc
          sudo mv /tmp/mc /usr/local/bin/mc

      - name: Install buildah
        if: ${{ inputs.login_ghcr }}
        run: sudo apt-get update && sudo apt-get install -y buildah

      - name: Login Vault
        run: |
          vault login "$VAULT_TOKEN"

      - name: Login MinIO
        if: ${{ inputs.login_minio }}
        run: |
          ENDPOINT=$(vault kv get -field=endpoint_url kv/minio/creds)
          ACCESS_KEY=$(vault kv get -field=access_key_id kv/minio/creds)
          SECRET_KEY=$(vault kv get -field=secret_access_key kv/minio/creds)
          mc alias set minio "$ENDPOINT" "$ACCESS_KEY" "$SECRET_KEY" --insecure
          echo "MINIO_ENDPOINT=$ENDPOINT" >> $GITHUB_ENV
          echo "MINIO_ACCESS_KEY=$ACCESS_KEY" >> $GITHUB_ENV
          echo "MINIO_SECRET_KEY=$SECRET_KEY" >> $GITHUB_ENV

      - name: Login GHCR
        if: ${{ inputs.login_ghcr }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | buildah login ghcr.io -u ${{ github.actor }} --password-stdin
