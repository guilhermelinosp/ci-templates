name: dockle

# Docker container CIS benchmark linter
# Inputs: image, exit-code (default: 1)

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      exit-code:
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run dockle
        uses: goodwithtech/dockle-action@v0.4.15
        with:
          image: ${{ inputs.image }}
          exit-code: ${{ inputs.exit-code }}
          format: sarif
          output: dockle.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: dockle.sarif
