name: helm-publish

on:
  workflow_call:
    inputs:
      chart-dir:
        required: false
        default: "."
        type: string
      registry:
        required: false
        default: oci://ghcr.io/${{ github.repository_owner }}/helm-charts
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: latest

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: |
          helm package ${{ inputs.chart-dir }} \
            --version ${{ inputs.version }} \
            --destination /tmp/charts

      - name: Push chart
        run: |
          helm push /tmp/charts/*.tgz ${{ inputs.registry }}
