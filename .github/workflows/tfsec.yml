name: tfsec

# Terraform/IaC security scanner (migrated from tfsec to Trivy `trivy config`)
# Inputs: dir (default: .), config-file, soft-fail (default: false)

on:
  workflow_call:
    inputs:
      dir:
        required: false
        default: "."
        type: string
      config-file:
        required: false
        default: ""
        type: string
      soft-fail:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          command: config
          scan-type: fs
          input: ${{ inputs.dir }}
          format: sarif
          output: tfsec.sarif
          exit-code: ${{ inputs.soft-fail && '0' || '1' }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          trivy-config: ${{ inputs.config-file }}

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tfsec.sarif
