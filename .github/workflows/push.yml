name: push

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      image:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Setup buildx
        run: |
          if ! docker buildx version &>/dev/null; then
            mkdir -p ~/.docker/cli-plugins
            curl -sL "https://github.com/docker/buildx/releases/download/v0.33.0/buildx-v0.33.0.linux-amd64" -o ~/.docker/cli-plugins/docker-buildx && chmod +x ~/.docker/cli-plugins/docker-buildx
          fi
      - name: Promote tags
        run: |
          SRC="${{ inputs.image }}"
          DST="ghcr.io/${{ github.repository }}"
          docker buildx imagetools create --tag "$DST:latest" --tag "$DST:${GITHUB_SHA::7}" "$SRC"
          TAG="${{ inputs.version }}"
          if [ -n "$TAG" ]; then
            docker buildx imagetools create --tag "$DST:$TAG" "$SRC"
          fi
