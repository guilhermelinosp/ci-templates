name: push

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      image:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Promote tags
        run: |
          SRC="${{ inputs.image }}"
          DST="ghcr.io/${{ github.repository }}"
          docker buildx imagetools create --tag "$DST:latest" --tag "$DST:${GITHUB_SHA::7}" "$SRC"
          if [ -n "${{ inputs.version }}" ]; then
            docker buildx imagetools create --tag "$DST:${{ inputs.version }}" "$SRC"
          fi
