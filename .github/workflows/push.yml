name: push

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: self-hosted
        type: string
      image:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ""
      tag:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Login GHCR
        run: |
          TOKEN="${{ secrets.GHCR_PAT }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
          echo "$TOKEN" | skopeo login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Promote tags
        run: |
          SRC="${{ inputs.image }}"
          DST="ghcr.io/${{ github.repository }}"
          skopeo copy "docker://${SRC}" "docker://${DST}:latest"
          skopeo copy "docker://${SRC}" "docker://${DST}:${GITHUB_SHA::7}"
          TAG="${{ inputs.version }}"
          if [ -n "$TAG" ]; then
            skopeo copy "docker://${SRC}" "docker://${DST}:${TAG}"
          fi
