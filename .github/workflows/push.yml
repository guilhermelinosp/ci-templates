name: push

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: self-hosted
        type: string
      image:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ""
      tag:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ${{ inputs.runner }}
    env:
      DOCKER_CONFIG: /tmp/.docker
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Login GHCR
        run: |
          mkdir -p /tmp/.docker
          TOKEN="${{ secrets.GHCR_PAT }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
          echo "$TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Promote tags
        run: |
          SRC="${{ inputs.image }}"
          DST="ghcr.io/${{ github.repository }}"
          docker buildx imagetools create --tag "$DST:latest" --tag "$DST:${GITHUB_SHA::7}" "$SRC"
          TAG="${{ inputs.version }}"
          if [ -n "$TAG" ]; then
            docker buildx imagetools create --tag "$DST:$TAG" "$SRC"
          fi
