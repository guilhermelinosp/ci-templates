name: pipeline

# ci-templates' own release pipeline. NOTE: this repository cannot import its
# own reusable workflows (GitHub rejects self-referencing `uses:`), so the
# steps are declared locally — they mirror release.yml semantics.

on:
  workflow_dispatch:

jobs:
  semver:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bump version and tag
        id: semver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD=$(git rev-parse HEAD)
          SEMVER='^v[0-9]+\.[0-9]+\.[0-9]+$'
          BETA='^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'
          EXISTING=$(git tag --points-at "$HEAD" \
            | grep -E "$SEMVER|$BETA" | head -1 || true)
          if [ -n "$EXISTING" ]; then
            echo "tag=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(git tag --sort=-version:refname \
            | grep -E "$SEMVER" | head -1 || true)
          if [ -z "$LAST" ]; then LAST=v1.0.0; fi
          IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
          SUBJECTS=$(git log --format="%s" "$LAST..HEAD")
          if echo "$SUBJECTS" | grep -q "BREAKING CHANGE\|!:"; then
            MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0
          elif echo "$SUBJECTS" | grep -q "^feat"; then
            MINOR=$((MINOR+1)); PATCH=0
          else
            PATCH=$((PATCH+1))
          fi
          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          git config user.name "github-actions[bot]"
          BOT="41898282+github-actions[bot]@users.noreply.github.com"
          git config user.email "$BOT"
          git tag "$TAG" && git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then exit 0; fi
          gh release create "$TAG" --title "$TAG" \
            --generate-notes --latest

  build-and-test:
    needs: [semver]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...
