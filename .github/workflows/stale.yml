name: stale

# Stale issue/PR management
# Secrets: GITHUB_TOKEN (auto)
# Inputs: days-before-stale (default: 60), days-before-close (default: 14)

on:
  workflow_call:
    inputs:
      days-before-stale:
        required: false
        default: 60
        type: number
      days-before-close:
        required: false
        default: 14
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: ${{ inputs.days-before-stale }}
          days-before-close: ${{ inputs.days-before-close }}
          stale-issue-message: "This issue has been automatically marked as stale."
          stale-pr-message: "This PR has been automatically marked as stale."
          close-issue-message: "Closing due to inactivity."
          close-pr-message: "Closing due to inactivity."
