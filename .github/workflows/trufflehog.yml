name: trufflehog

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan with trufflehog
        uses: trufflesecurity/trufflehog@v3.97.0
        with:
          extra_args: --only-verified --no-update
