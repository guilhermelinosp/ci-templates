name: labeler

# Auto-label PRs by changed paths
# Requires: .github/labeler.yml config
# Secrets: GITHUB_TOKEN (auto)

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
