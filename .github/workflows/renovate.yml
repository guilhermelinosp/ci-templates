name: renovate

# Renovate dependency update automation
# Secrets: RENOVATE_TOKEN (required - PAT with repo scope)
# Inputs: dry-run (default: false)

on:
  workflow_call:
    inputs:
      dry-run:
        required: false
        default: false
        type: boolean
      schedule:
        required: false
        default: "0 6 * * 1"
        type: string
    secrets:
      RENOVATE_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Renovate
        uses: renovatebot/github-action@7e1c0fa7cfd2c3e91b27cdd87ae09a6a0fafb5f2
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
          dry-run: ${{ inputs.dry-run }}
