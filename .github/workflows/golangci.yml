name: golangci

# Go lint with golangci-lint
# Inputs: go-version (default: stable) XOR go-version-file (file wins when set),
#         golangci-version (default: latest), working-directory (default: .)

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        default: "stable"
        type: string
      go-version-file:
        required: false
        default: ""
        type: string
      golangci-version:
        required: false
        default: "latest"
        type: string
      working-directory:
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go (from version)
        if: inputs.go-version-file == ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Setup Go (from version file)
        if: inputs.go-version-file != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ inputs.golangci-version }}
          working-directory: ${{ inputs.working-directory }}
