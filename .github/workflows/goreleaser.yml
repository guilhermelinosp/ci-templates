name: goreleaser

# Publishes cross-platform binaries onto the GitHub Release created by the
# `release` reusable (semver bump + tag). Attach this after release+build.
# Inputs: goreleaser-version (default: "~> v2"), args (default: release --clean),
#         pre-release-commands (optional shell block, e.g. architecture guard),
#         runner.
# Secrets: GITHUB_TOKEN (pass github.token from the caller).

on:
  workflow_call:
    inputs:
      goreleaser-version:
        required: false
        default: "~> v2"
        type: string
      args:
        required: false
        default: release --clean
        type: string
      pre-release-commands:
        description: Optional shell block before GoReleaser runs
        required: false
        default: ""
        type: string
      runner:
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      GITHUB_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  binaries:
    name: goreleaser / binaries
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch tag created by release job
        run: git fetch --tags --force && git checkout "$(git describe --tags --abbrev=0)"

      - name: Pre-release repository checks
        if: inputs.pre-release-commands != ''
        run: ${{ inputs.pre-release-commands }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ${{ inputs.goreleaser-version }}
          args: ${{ inputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
