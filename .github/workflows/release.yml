name: release

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: self-hosted
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          skip-github-pull-request: false
