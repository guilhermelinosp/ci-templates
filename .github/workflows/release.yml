name: release

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: self-hosted
        type: string
    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    outputs:
      version: ${{ steps.semver.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, token: "${{ github.token }}" }
      - name: Bump version
        id: semver
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          HEAD=$(git rev-parse HEAD)

          # Se commit já tem tag, pula
          TAG_EXISTENTE=$(git tag --points-at "$HEAD" 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "")
          if [ -n "$TAG_EXISTENTE" ]; then
            echo "Commit já tem tag $TAG_EXISTENTE — pulando"
            echo "tag=$TAG_EXISTENTE" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Pega ultima tag semver (vX.Y.Z), ignorando tags como 'latest'
          ULTIMA_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "")

          if [ -z "$ULTIMA_TAG" ]; then
            echo "tag=v1.0.1" >> $GITHUB_OUTPUT
            exit 0
          fi

          IFS='.' read -r M m p <<< "${ULTIMA_TAG#v}"
          M=${M:-1}; m=${m:-0}; p=${p:-0}

          git log --format="%s" "$ULTIMA_TAG..HEAD" 2>/dev/null | grep -q "BREAKING CHANGE\|!:" && { M=$((M+1)); m=0; p=0; } \
            || git log --format="%s" "$ULTIMA_TAG..HEAD" 2>/dev/null | grep -q "^feat" && { m=$((m+1)); p=0; } \
            || p=$((p+1))

          echo "tag=v${M}.${m}.${p}" >> $GITHUB_OUTPUT
      - name: Create release
        if: steps.semver.outputs.tag != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="${{ steps.semver.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Tag $TAG ja existe — pulando"
            exit 0
          fi
          gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --generate-notes
      - name: Update latest tag
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git tag -f latest && git push origin latest --force
