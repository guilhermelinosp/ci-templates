name: release

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: self-hosted
        type: string
    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    outputs:
      version: ${{ steps.semver.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Bump version
        id: semver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD=$(git rev-parse HEAD)
          TAG_EXISTENTE=$(git tag --points-at "$HEAD" 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' | head -1 || echo "")
          if [ -n "$TAG_EXISTENTE" ]; then
            echo "tag=$TAG_EXISTENTE" >> $GITHUB_OUTPUT
            exit 0
          fi
          ULTIMA_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' | head -1 || echo "")
          if [ -z "$ULTIMA_TAG" ]; then
            echo "tag=v1.0.1" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Check if last tag was beta
          if [[ "$ULTIMA_TAG" =~ -beta\.([0-9]+)$ ]]; then
            BETA_NUM=${BASH_REMATCH[1]}
            BASE="${ULTIMA_TAG%-beta*}"
            echo "tag=${BASE}-beta.$((BETA_NUM + 1))" >> $GITHUB_OUTPUT
            exit 0
          fi
          IFS='.' read -r M m p <<< "${ULTIMA_TAG#v}"
          M=${M:-1}; m=${m:-0}; p=${p:-0}
          git log --format="%s" "$ULTIMA_TAG..HEAD" 2>/dev/null | grep -q "BREAKING CHANGE\|!:" && { M=$((M+1)); m=0; p=0; } \
            || git log --format="%s" "$ULTIMA_TAG..HEAD" 2>/dev/null | grep -q "^feat" && { m=$((m+1)); p=0; } \
            || p=$((p+1))
          echo "tag=v${M}.${m}.${p}" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag "${{ steps.semver.outputs.tag }}"
          git push origin "${{ steps.semver.outputs.tag }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.semver.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.semver.outputs.tag }}" \
            --generate-notes --latest

      - name: Update latest tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest && git push origin latest --force
