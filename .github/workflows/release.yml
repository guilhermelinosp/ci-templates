name: release

# Semver bump + git tag + GitHub release
# Inputs: runner (default: ubuntu-latest)
#
# Optional signed tags: set repo/org secrets GPG_PRIVATE_KEY (armored private
# key) + GPG_PASSPHRASE. When present, release tags are created as signed,
# annotated tags (git tag -s). When absent, behavior is unchanged (lightweight
# tags).

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: ubuntu-latest
        type: string
    outputs:
      version:
        value: ${{ jobs.semver.outputs.version }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

jobs:
  semver:
    runs-on: ${{ inputs.runner }}
    outputs:
      version: ${{ steps.semver.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump version
        id: semver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD=$(git rev-parse HEAD)
          EXISTING_TAG=$(git tag --points-at "$HEAD" 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' | head -1 || echo "")
          if [ -n "$EXISTING_TAG" ]; then
            echo "tag=$EXISTING_TAG" >> $GITHUB_OUTPUT
            exit 0
          fi
          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' | head -1 || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Check if last tag was beta
          if [[ "$LAST_TAG" =~ -beta\.([0-9]+)$ ]]; then
            BETA_NUM=${BASH_REMATCH[1]}
            BASE="${LAST_TAG%-beta*}"
            echo "tag=${BASE}-beta.$((BETA_NUM + 1))" >> $GITHUB_OUTPUT
            exit 0
          fi
          IFS='.' read -r M m p <<< "${LAST_TAG#v}"
          M=${M:-1}; m=${m:-0}; p=${p:-0}
          git log --format="%s" "$LAST_TAG..HEAD" 2>/dev/null | grep -q "BREAKING CHANGE\|!:" && { M=$((M+1)); m=0; p=0; } \
            || git log --format="%s" "$LAST_TAG..HEAD" 2>/dev/null | grep -q "^feat" && { m=$((m+1)); p=0; } \
            || p=$((p+1))
          echo "tag=v${M}.${m}.${p}" >> $GITHUB_OUTPUT

      - name: Import GPG key for tag signing
        if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent 2>/dev/null || true
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import
          KEY_ID=$(gpg --list-secret-keys --with-colons --keyid-format long 2>/dev/null | awk -F: '/^sec:/{print $5; exit}')
          UID_LINE=$(gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '/^uid:/{print $10; exit}')
          NAME=$(echo "$UID_LINE" | sed 's/<.*//;s/[[:space:]]*$//')
          EMAIL=$(echo "$UID_LINE" | sed -n 's/.*<\(.*\)>.*/\1/p')
          git config user.signingkey "$KEY_ID"
          git config user.name "$NAME"
          git config user.email "$EMAIL"
          git config tag.gpgsign true
          WRAPPER="$RUNNER_TEMP/gpg-wrapper.sh"
          printf '#!/bin/sh\nexec gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" "$@"\n' > "$WRAPPER"
          chmod +x "$WRAPPER"
          git config gpg.program "$WRAPPER"

      - name: Create tag
        run: |
          TAG="${{ steps.semver.outputs.tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "v" ]; then
            echo "Invalid tag ($TAG) — skipping"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping"
            exit 0
          fi
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            git tag -s "$TAG" -m "Release $TAG"
          else
            git tag "$TAG"
          fi
          git push origin "$TAG"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.semver.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.semver.outputs.tag }}" \
            --generate-notes --latest

      - name: Update latest tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # latest is an intentionally mutable tag — force push is correct
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            git tag -sf latest -m "Latest release"
          else
            git tag -f latest
          fi
          git push origin latest --force
