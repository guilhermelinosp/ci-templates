name: release

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create version tag
        id: semver
        run: |
          set -euo pipefail

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            git fetch --tags 2>/dev/null || true
            LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1 || true)

            if [ -z "$LATEST_TAG" ]; then
              VERSION="v1.0.0"
            else
              TAG_NUM=${LATEST_TAG#v}
              IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_NUM"
              PATCH=$((PATCH + 1))
              VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Tag commit
        run: |
          set -euo pipefail
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Update latest tag
        run: |
          set -euo pipefail
          git tag -f latest
          git push origin latest --force

      - name: Update VERSION file on main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main
          echo "$VERSION" > VERSION

          if git diff --quiet -- VERSION; then
            echo "VERSION unchanged; nothing to commit"
          else
            git add VERSION
            git commit -m "chore(release): update VERSION to $VERSION"
            git push origin HEAD:main
          fi

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | awk -v v="$VERSION" '$0!=v{print; exit}') || true

          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..${VERSION}" || true)
          else
            NOTES=$(git log --no-merges --pretty=format:'- %s (%h)' -n 50 "${VERSION}" || true)
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Updating existing release $VERSION"
            gh release edit "$VERSION" --title "$VERSION" --notes "$NOTES"
          else
            echo "Creating release $VERSION"
            gh release create "$VERSION" --title "$VERSION" --notes "$NOTES"
          fi

      - name: Set workflow output
        id: set_version
        run: echo "version=$VERSION" >> $GITHUB_OUTPUT
