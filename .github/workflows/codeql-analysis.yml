name: codeql

# CodeQL security & quality analysis for every PR to main.
# Sequential languages (Go autobuild + Actions none) instead of matrix:
# strategy blocks under workflow_call have proven brittle across callers.
# Caller must allow security-events: write.

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL (go)
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild
          queries: +security-and-quality

      - name: Perform CodeQL Analysis (go)
        uses: github/codeql-action/analyze@v4

      - name: Initialize CodeQL (actions)
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: +security-and-quality

      - name: Perform CodeQL Analysis (actions)
        uses: github/codeql-action/analyze@v4
