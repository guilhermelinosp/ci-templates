name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflow syntax
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml; do
            echo "Checking $f..."
            if grep -q 'workflow_call' "$f" 2>/dev/null; then
              echo "  ✅ Has workflow_call trigger"
            else
              echo "  ⚠️  No workflow_call trigger"
            fi
          done
      - name: Check config.yml example
        run: |
          set -euo pipefail
          if [ -f config.yml ]; then
            echo "config.yml exists ✅"
          else
            echo "⚠️  config.yml not found (optional)"
          fi
      - name: System info
        run: |
          echo "Runner: $(uname -a)"
          echo "Tools: gh=$(gh --version 2>&1 | head -1), yq=$(yq --version 2>&1)"
