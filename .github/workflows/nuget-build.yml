name: nuget-build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    env:
      DOTNET_ROOT: /usr/share/dotnet
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # .NET is provided by the runner image — no setup-dotnet step needed.

      - name: Detect solution
        run: |
          SLN=$(ls *.slnx *.sln 2>/dev/null | head -1 || echo "")
          echo "SLN=$SLN" >> $GITHUB_ENV

      - name: Restore
        run: |
          [ -n "$SLN" ] && dotnet restore "$SLN"

      - name: Build
        run: |
          [ -n "$SLN" ] && dotnet build "$SLN" --configuration Release --no-restore

      - name: Test
        run: |
          [ -n "$SLN" ] && dotnet test "$SLN" --configuration Release --no-build --verbosity normal
