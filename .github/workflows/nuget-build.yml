name: nuget-build

# NuGet .NET restore, build, test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Detect solution
        run: |
          SLN=$(ls *.slnx *.sln 2>/dev/null | head -1 || echo "")
          echo "SLN=$SLN" >> $GITHUB_ENV

      - name: Restore
        run: |
          [ -n "$SLN" ] && dotnet restore "$SLN"

      - name: Build
        run: |
          [ -n "$SLN" ] && dotnet build "$SLN" --configuration Release --no-restore

      - name: Test
        run: |
          [ -n "$SLN" ] && dotnet test "$SLN" --configuration Release --no-build --verbosity normal
