name: nuget-build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Detect solution
        run: |
          SLN=$(ls *.slnx *.sln 2>/dev/null | head -1 || echo "")
          echo "SLN=$SLN" >> $GITHUB_ENV

      - name: Restore
        run: [ -n "$SLN" ] && dotnet restore "$SLN"

      - name: Build
        run: [ -n "$SLN" ] && dotnet build "$SLN" --configuration Release --no-restore

      - name: Test
        run: [ -n "$SLN" ] && dotnet test "$SLN" --configuration Release --no-build --verbosity normal
