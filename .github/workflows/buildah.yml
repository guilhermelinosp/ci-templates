name: buildah

# Builds and pushes container images using buildah
# Secrets: GITHUB_TOKEN (auto), GHCR_PAT (optional)
# Inputs: runner (default: ubuntu-latest), version (required)

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: ubuntu-latest
        type: string
      version:
        required: true
        type: string
    outputs:
      image:
        value: ${{ jobs.image.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ${{ inputs.runner }}
    outputs:
      image: ${{ steps.export.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Login GHCR
        run: |
          TOKEN="${{ secrets.GHCR_PAT }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
          echo "$TOKEN" | buildah login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"
          SHA="${GITHUB_SHA::7}"
          buildah build \
            -t "${IMG}:${VERSION}" \
            -t "${IMG}:${SHA}" \
            -t "${IMG}:latest" \
            .

      - name: Push image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"
          SHA="${GITHUB_SHA::7}"
          buildah push "${IMG}:${VERSION}"
          buildah push "${IMG}:${SHA}"
          buildah push "${IMG}:latest"

      - name: Export digest
        id: export
        env:
          VERSION: ${{ inputs.version }}
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${IMG}:${VERSION}")
          echo "image=${IMG}@${DIGEST}" >> $GITHUB_OUTPUT