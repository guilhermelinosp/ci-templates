name: nuget-publish

# NuGet pack + push to GitHub Packages + NuGet.org
# Secrets: GITHUB_TOKEN (auto), NUGET_API_KEY (optional)

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.x'

      - name: Detect solution
        run: |
          SLN=$(ls *.slnx *.sln 2>/dev/null | head -1 || echo "")
          echo "SLN=$SLN" >> $GITHUB_ENV

      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$SLN" ] && dotnet pack "$SLN" --configuration Release --output ./artifacts -p:Version=$VERSION

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NuGet.org
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ env.NUGET_API_KEY }}
