name: trivy

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: self-hosted
        type: string
      image:
        required: true
        type: string

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Scan
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format sarif --output trivy.sarif --no-progress "${{ inputs.image }}" || true
      - name: Upload SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
