name: trivy

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      image:
        required: true
        type: string

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Install trivy
        run: |
          if ! command -v trivy &>/dev/null; then
            curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
            tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy && chmod +x /usr/local/bin/trivy 2>/dev/null || true
          fi
      - name: Scan
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format sarif --output trivy.sarif --no-progress "${{ inputs.image }}" || true
      - name: Upload SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
