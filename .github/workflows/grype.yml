name: grype

# Vulnerability scanner with Grype
# Inputs: image, severity (default: high,critical), fail-on (default: critical)

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      severity:
        required: false
        default: "high,critical"
        type: string
      fail-on:
        required: false
        default: "critical"
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan with Grype
        uses: anchore/scan-action@v6
        with:
          image: ${{ inputs.image }}
          severity-cutoff: ${{ inputs.severity }}
          fail-build: true
          output-format: sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
