name: pr-staging

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate branch name
        run: |
          HEAD="${{ github.head_ref }}"
          echo "Branch: $HEAD → staging"
          case "$HEAD" in
            feat/*) echo "✅ $HEAD → staging" ;;
            *) echo "❌ Para staging, use feat/*"; exit 1 ;;
          esac

      - name: Validate PR title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if echo "$TITLE" | grep -qE '^(feat|fix|docs|style|ref|refactor|test|chore|ci|perf|build|revert)(\(.+\))?!?:\s.+'; then
            echo "✅ PR title: $TITLE"
          else
            echo "❌ PR title deve seguir Conventional Commits"
            exit 1
          fi

      - name: Validate commits
        run: |
          git fetch origin ${{ github.base_ref }} 2>/dev/null || true
          git log --oneline origin/${{ github.base_ref }}..HEAD 2>/dev/null | while read line; do
            if echo "$line" | grep -q '^Merge'; then continue; fi
            MSG=$(echo "$line" | sed 's/^[a-f0-9]* //')
            if ! echo "$MSG" | grep -qE '^(feat|fix|docs|style|ref|refactor|test|chore|ci|perf|build|revert)(\(.+\))?!?:\s.+'; then
              echo "❌ $MSG"
              exit 1
            fi
            echo "✅ $MSG"
          done
